name: TripBase
options:
  bundleIdPrefix: io.github.supamucho76wq
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_LANGUAGE: ja
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TripBase:
    type: application
    platform: iOS
    sources:
      - path: TripBase
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.supamucho76wq.tripbase
        PRODUCT_NAME: TripBase
        INFOPLIST_FILE: TripBase/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        SWIFT_STRICT_CONCURRENCY: targeted
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - TripBaseTests
        - TripBaseUITests
  TripBaseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TripBaseTests
    dependencies:
      - target: TripBase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.supamucho76wq.tripbase.tests
        GENERATE_INFOPLIST_FILE: true
  TripBaseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TripBaseUITests
    dependencies:
      - target: TripBase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.supamucho76wq.tripbase.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: TripBase
